name: nalori
description: "Nalori EPUB reader."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  epubx:
    path: packages/epubx
  html: ^0.15.6
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.4
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
  http: ^1.6.0
  crypto: ^3.0.6
  sqflite: ^2.4.1
  uuid: ^4.5.3
  share_plus: ^12.0.1
  flutter_svg: ^2.0.10+1
  intl: any
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  archive: ^3.6.1
  image: ^3.3.0
  flutter_lints: ^5.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.27

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/nalori_mark.svg
    - assets/images/nalori_app_icon.png
    - assets/catalog/gutenberg_starter_catalog.json
    # Test-only local Lexend bytes registered through the reader-contract
    # FontLoader alias; this does not declare or change a production family.
    - assets/fonts/reader_contract/Lexend-Regular.ttf
    - assets/fonts/reader_contract/Lexend-SemiBold.ttf
    - assets/fonts/reader_contract/Lexend-Bold.ttf
    - assets/fonts/reader_contract/Lexend-Black.ttf
    - assets/fonts/reader/
    - assets/fonts/reader/licenses/
    - test/fixtures/books/feature_rich_lazy_reader.epub
    - Dialogues -- Plato.epub
  fonts:
    - family: NaloriReaderInter
      fonts:
        - asset: assets/fonts/reader/Inter-300-Normal.ttf
          weight: 300
        - asset: assets/fonts/reader/Inter-400-Normal.ttf
          weight: 400
        - asset: assets/fonts/reader/Inter-500-Normal.ttf
          weight: 500
        - asset: assets/fonts/reader/Inter-600-Normal.ttf
          weight: 600
        - asset: assets/fonts/reader/Inter-700-Normal.ttf
          weight: 700
        - asset: assets/fonts/reader/Inter-800-Normal.ttf
          weight: 800
        - asset: assets/fonts/reader/Inter-900-Normal.ttf
          weight: 900
        - asset: assets/fonts/reader/Inter-300-Italic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/reader/Inter-400-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/reader/Inter-500-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/reader/Inter-600-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/reader/Inter-700-Italic.ttf
          weight: 700
          style: italic
